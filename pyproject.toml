[project]
name = "krea-2-oss"
version = "0.1.0"
description = "Krea 2 inference and memory-efficient character LoRA training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "transformers==4.57.1",
    "safetensors>=0.4.0",
    "pillow>=10.0.0",
    "einops>=0.7.0",
    "diffusers>=0.32.0",
    "click>=8.4.1",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krea2"]

[project.optional-dependencies]
train = [
    "torchvision",
]
face-reward = [
    "numpy>=1.26.0",
    "opencv-python>=4.10.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "insightface>=0.7.3",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: requires a CUDA GPU",
    "face_models: requires antelopev2 models and reference images",
    "slow: long-running integration coverage",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
